
name: Actualizar lista IPTV

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Combinar listas
        run: |
          python - <<'PY'
          import urllib.request
          import os
          import re

          fuentes = [
              ("https://iptv-org.github.io/iptv/index.country.m3u", None),
              ("https://iptv-org.github.io/iptv/categories/sports.m3u", "Deportes"),
              ("https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8", None)
          ]

          salida = []
          vistos = set()

          for url, grupo_forzado in fuentes:
              print("Descargando:", url)

              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )

              with urllib.request.urlopen(req, timeout=90) as respuesta:
                  lineas = respuesta.read().decode(
                      "utf-8", errors="replace"
                  ).splitlines()

              actual = []

              for linea in lineas:
                  linea = linea.strip()

                  if not linea or linea == "#EXTM3U":
                      continue

                  if linea.startswith("#EXTINF:"):
                      actual = [linea]
                      continue

                  if actual:
                      actual.append(linea)

                      if not linea.startswith("#"):
                          cabecera, separador, nombre = actual[0].partition(",")

                          if grupo_forzado:
                              if re.search(r'group-title="[^"]*"', cabecera):
                                  cabecera = re.sub(
                                      r'group-title="[^"]*"',
                                      'group-title="Deportes"',
                                      cabecera
                                  )
                              else:
                                  cabecera += ' group-title="Deportes"'

                              actual[0] = cabecera + separador + nombre

                          grupo = re.search(
                              r'group-title="([^"]*)"', actual[0]
                          )
                          nombre_grupo = grupo.group(1) if grupo else ""

                          clave = (nombre_grupo, linea)

                          if clave not in vistos:
                              vistos.add(clave)
                              salida.extend(actual)

                          actual = []

          contenido = "#EXTM3U\n" + "\n".join(salida) + "\n"

          with open("lista-combinada.m3u", "w", encoding="utf-8") as f:
              f.write(contenido)

          os.makedirs("_site", exist_ok=True)

          with open("_site/lista-combinada.m3u", "w", encoding="utf-8") as f:
              f.write(contenido)

          print("Canales incluidos:", len(vistos))
          print("Lista combinada generada correctamente.")
          PY

      - name: Guardar lista en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lista-combinada.m3u
          git diff --cached --quiet || git commit -m "Actualizar lista IPTV"
          git push

      - name: Subir archivo para Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Publicar lista
        id: deployment
        uses: actions/deploy-pages@v4
